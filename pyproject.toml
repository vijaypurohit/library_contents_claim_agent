[project]
name = "claimagent"
version = "0.1.0"
description = "Live voice-and-vision agent that inventories, measures and prices a home library from one camera sweep"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.2",
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "imagehash>=4.3",
    "litellm>=1.50",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "pillow-heif>=0.18",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14.6",
    "typer>=0.12",
    "uvicorn[standard]>=0.54.0",
    "websockets>=13",
]

[project.scripts]
claim = "claimagent.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claimagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: runs on capture/ with real or cached model responses"]
