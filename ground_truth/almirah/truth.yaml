# Ground truth for the almirah test space (tests-local-data/).
# Collected by hand, BEFORE tuning. The evaluation tool (`claim eval`) compares packets against this file.
#
# Books were read from still_photo_both.heic and checked by hand.
verified: true

site: almirah
sweeps: [photos, slow, rush, far]   # sweeps captured in this space

# Total physical books. An 11th book may be hidden behind book A2-2 (only a sliver of a
# "SANJIV" spine is visible); set this to 11 if it is really there.
book_count: 10

# Positions: unit A = the almirah; shelf 1 = top; position = order from the left.
# The two flat books on the top shelf are a stack to the right of the upright books;
# they are numbered top of the stack first.
