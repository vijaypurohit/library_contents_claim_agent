     title: "Word Power Made Easy", author: "Norman Lewis"}
  - {unit: A, shelf: 1, position: 5, orientation: flat, legible: true,
     title: "English Language and Literature Class X", author: null}   # top of the stack
  - {unit: A, shelf: 1, position: 6, orientation: flat, legible: true,
     title: "Pradeep's Fundamental Physics Class XII", author: "K.L. Gomber, K.L. Gogia"}
  - {unit: A, shelf: 2, position: 1, orientation: upright, legible: false,
     title: "Secondary School Mathematics for Class 10", author: "R.S. Aggarwal, V. Aggarwal"}  # small print, hard to read
